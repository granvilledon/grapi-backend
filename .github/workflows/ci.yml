name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      # 编译 + 打包（单测依赖外部 MySQL/Redis/Nacos，放到本地跑）
      - name: Build
        run: mvn -B -q package -DskipTests

      - name: Verify no secrets committed
        run: |
          ! grep -rn "1234zxcv" --include="*.yml" --include="*.properties" .
          ! grep -rn "123456" grapi-service/src/main/resources grapi-client-sdk/src/main/resources
